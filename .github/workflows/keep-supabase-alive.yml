# Keeps the shared free-plan Supabase project from pausing after 7 quiet days.
# No credential: it requests the Cube showcase, an ISR page (revalidate 1 day), so a
# request after a day regenerates it: site → Cube → Postgres as cube_reader.
# A non-200 fails the run, and GitHub emails the owner.
name: keep-supabase-alive

on:
  schedule:
    - cron: "17 6 */2 * *" # 06:17 UTC on odd days: at most 2 days apart
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash # explicit, for pipefail: a failed curl fails the step, not grep
        run: >
          curl -fsS -o /dev/null -D - --max-time 120
          https://vosk.dev/work/online-sales-cube
          | grep -iE "^(HTTP|age|x-vercel-cache)"
