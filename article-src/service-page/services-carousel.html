<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bundled Page</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #faf9f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #__bundler_loading {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #666;
        background: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        z-index: 10000;
      }
      #__bundler_thumbnail {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f5;
        z-index: 9999;
      }
      #__bundler_thumbnail svg {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #__bundler_placeholder {
        color: #999;
        font-size: 14px;
      }
    </style>

    <div id="__bundler_thumbnail">
      <svg sc-camel-view-box="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#FBF1DA"></rect>
        <rect x="30" y="30" width="40" height="40" rx="8" fill="#1c1a15"></rect>
        <text
          x="50"
          y="57"
          font-family="sans-serif"
          font-size="20"
          font-weight="700"
          fill="#FBF1DA"
          text-anchor="middle"
        >
          V
        </text>
      </svg>
    </div>
    <div id="__bundler_loading">Unpacking...</div>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        const FONT_MIME =
          /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
        function toBase64(bytes) {
          let bin = "";
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(
              null,
              bytes.subarray(i, i + 0x8000),
            );
          }
          return btoa(bin);
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            // Failed resource loads (CSP-blocked links, scripts, images) fire plain
            // events at the element — warn only; real JS errors carry message/error.
            if (!e.message && !e.error && e.target && e.target !== window) {
              console.warn(
                "[bundle] resource failed to load:",
                e.target.tagName,
                String(e.target.src || e.target.href || ""),
              );
              return;
            }
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
          // document's manifest; frame srcs carry an about:blank#<uuid> marker
          // instead of a substitutable uuid. Every document mints the blobs for
          // its OWN frames — from local text at the root, or text obtained from
          // its DIRECT parent over the relay protocol below — so each frame
          // navigation stays same-origin with its initiator and a deduped page
          // loads at any depth on any host, including a file:// download's
          // opaque origins (where a blob minted by one document cannot be
          // navigated to by another).
          const pageOrderEl = document.querySelector(
            'script[type="__bundler/page_order"]',
          );
          const pageOrder = pageOrderEl
            ? JSON.parse(pageOrderEl.textContent)
            : [];
          const pageSet = new Set(pageOrder);
          const pageTexts = {};

          // ── Nested-page text protocol (parent-chain relay) ──
          // Page bundles ship once, in the ROOT document's manifest. Every
          // document mints the blobs for its OWN frames, obtaining page text
          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own
          // runtime minted, is another publisher document) and only ACCEPTS
          // text from that direct parent; requests from below are honored only
          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an
          // artifact, so window.top can be a FOREIGN document — a top-addressed
          // protocol would hand page uuids to that ancestor and accept forged
          // "page text" from it, minting attacker HTML as an artifact-origin
          // blob document. The chain never touches the ancestor: requests stop
          // at the root, replies are origin-addressed per hop (never '*' when
          // an origin exists), and both directions are origin-gated (on https
          // a foreign sender's origin can never equal this document's; in
          // opaque contexts — file:// — everything serializes as 'null', where
          // an embedded EXTERNAL frame still fails the gate by carrying its
          // own real origin, and a sandboxed child of such a frame is excluded
          // by the own-child-frames check plus uuid unguessability). Shape is
          // deny-by-default: one request form, one reply form, no error
          // replies.
          // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
          // contexts such as a sandboxed preview iframe) — location.origin is
          // computed from the URL and stays 'https://…' even when the document
          // is sandboxed, which would misgate every opaque chain.
          const OWN_TARGET = /^https?:[/][/]/.test(window.origin || "")
            ? window.origin
            : "*";
          function trustedOrigin(e) {
            if (e.origin === window.origin) return true; // https chains; opaque==opaque
            // file:// trees: Chrome serializes the file document's origin as
            // 'file://' while the blob: documents it mints serialize as 'null',
            // so the two legitimate shapes can never string-match — accept the
            // pair in both directions. https origins never serialize as either,
            // and sender identity (own child frame / direct parent) is checked
            // separately.
            return (
              (e.origin === "null" &&
                (window.origin === "file://" ||
                  window.location.protocol === "file:")) ||
              (/^file:/.test(e.origin) && window.origin === "null")
            );
          }
          // Non-empty only in the root document (nested bundles ship an empty
          // island), so it doubles as the root marker: the root answers from
          // local text and treats a miss as authoritative — never relaying to
          // its (possibly foreign) parent.
          const isPageRoot = pageOrder.length > 0;
          const blobUrls = {};
          const resourceBlobs = {};
          const UUID_SHAPE =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
          const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
          function mountPage(el, frag, text) {
            const pageBlob = new Blob([text], { type: "text/html" });
            const u = URL.createObjectURL(pageBlob);
            resourceBlobs[u] = pageBlob;
            el.src = u + frag;
          }
          function deliverPage(uuid, text) {
            const frames = pendingFrames[uuid];
            delete pendingFrames[uuid];
            if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
            const relays = pendingRelays[uuid];
            delete pendingRelays[uuid];
            if (relays) {
              for (const cw of relays) {
                try {
                  cw.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
              }
            }
          }
          function ownFrameWindows() {
            const out = [];
            for (const f of Array.from(document.querySelectorAll("iframe"))) {
              try {
                if (f.contentWindow) out.push(f.contentWindow);
              } catch (err) {
                /* detached */
              }
            }
            return out;
          }
          window.addEventListener("message", function (e) {
            const d = e.data;
            if (!d || typeof d !== "object" || !e.source) return;
            // Origin gate first; the structural checks below (own-child-frames
            // for requests, direct-parent + solicited-uuid for replies, the
            // root's never-relay rule) are what hold in fully opaque chains
            // where origin strings can't discriminate — a sandboxed root's
            // FOREIGN wrapper still fails all three even though both serialize
            // as real-vs-'null' rather than matching.
            if (!trustedOrigin(e)) return;
            if (
              typeof d.__bundler_need === "string" &&
              UUID_SHAPE.test(d.__bundler_need)
            ) {
              // Requests are honored only for this document's own child frames.
              if (ownFrameWindows().indexOf(e.source) < 0) return;
              const uuid = d.__bundler_need;
              const text = pageTexts[uuid];
              if (typeof text === "string") {
                try {
                  e.source.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
                return;
              }
              if (isPageRoot || window.parent === window) return; // authoritative miss
              const waiting = pendingRelays[uuid];
              if (waiting) {
                if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
                return;
              }
              // Never-answered uuids would otherwise accumulate forever under a
              // request spray; past the cap (far above any real page count) new
              // relays are dropped rather than remembered.
              if (Object.keys(pendingRelays).length >= 128) return;
              pendingRelays[uuid] = [e.source];
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            } else if (
              typeof d.__bundler_page === "string" &&
              UUID_SHAPE.test(d.__bundler_page) &&
              typeof d.__bundler_text === "string"
            ) {
              // The shape test is load-bearing beyond tidiness: the solicited
              // check below uses the in operator, which matches prototype keys
              // ('__proto__', 'constructor') — an unshaped key would reach
              // deliverPage and throw, painting the error banner.
              // Text is accepted only from the direct parent — the document
              // that minted this one.
              if (e.source !== window.parent || window.parent === window)
                return;
              if (
                !(d.__bundler_page in pendingFrames) &&
                !(d.__bundler_page in pendingRelays)
              )
                return;
              deliverPage(d.__bundler_page, d.__bundler_text);
            }
          });

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                if (pageSet.has(uuid)) {
                  pageTexts[uuid] = new TextDecoder().decode(finalBytes);
                  return;
                }
                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    "data:" +
                    entry.mime +
                    ";base64," +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);
                } else {
                  const blob = new Blob([finalBytes], { type: entry.mime });
                  blobUrls[uuid] = URL.createObjectURL(blob);
                  resourceBlobs[blobUrls[uuid]] = blob;
                }
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                const blob = new Blob([], { type: entry.mime });
                blobUrls[uuid] = URL.createObjectURL(blob);
                resourceBlobs[blobUrls[uuid]] = blob;
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
          // consumers read these Blobs directly. Survives the swap like the error sink.
          window.__resourceBlobs = resourceBlobs;

          setStatus("Rendering...");
          // Page uuids have no blob here — they ride inside about:blank#<uuid>
          // frame markers the pass below resolves after the swap.
          for (const uuid of uuids) {
            if (pageSet.has(uuid)) continue;
            template = template.split(uuid).join(blobUrls[uuid]);
          }

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap).replace(/<\//g, "<\\/") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
            const needed = [];
            for (const el of Array.from(document.querySelectorAll("iframe"))) {
              const m = MARKER.exec(el.getAttribute("src") || "");
              if (!m) continue;
              const text = pageTexts[m[1]];
              if (typeof text === "string") {
                mountPage(el, m[2] || "", text);
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]];
                (pendingFrames[m[1]] = had || []).push({
                  el: el,
                  frag: m[2] || "",
                });
                if (!had) needed.push(m[1]);
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            }
          }

          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: read and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const pre = resourceBlobs[s.src.split("#")[0]];
              s.textContent = pre
                ? await pre.text()
                : await (await fetch(s.src)).text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

',system-ui,sans-serif; overflow:hidden;\">\n\n  <!-- nav -->\n  <div style=\"flex:none; display:flex; align-items:center; justify-content:space-between; padding:24px 56px; border-bottom:1px solid rgba(30,20,0,.07);\">\n    <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:.02em; color:#1a160f;\">VOSK<\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:34px; font-size:16px; color:#5f574a;\">\n      <span>Home<\u002Fspan><span>Showcase<\u002Fspan><span>Blog<\u002Fspan>\n      <span style=\"color:#1a160f; font-weight:600;\">Services<\u002Fspan><span>Contacts<\u002Fspan>\n      <span style=\"background:#1c1a15; color:#FBF1DA; font-weight:600; padding:11px 22px; border-radius:12px;\">Message<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1; min-height:0; max-width:1200px; width:100%; margin:0 auto; padding:34px 56px 38px; box-sizing:border-box; display:flex; flex-direction:column;\">\n    <!-- header -->\n    <div style=\"flex:none; display:flex; align-items:flex-end; justify-content:space-between; gap:32px; margin-bottom:26px;\">\n      <h1 style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:44px; line-height:1; margin:0; color:#1a160f;\">\n        <span style=\"background:linear-gradient(180deg,transparent 55%,rgba(233,146,44,.55) 55%); padding:0 6px;\">Services<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size:15px; line-height:1.45; color:#6c6353; margin:0; max-width:520px; text-align:right;\">BI delivery and consulting on Power BI and Superset — pick the engagement that fits. Swipe the options with more than one plan.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- three carousels in one row -->\n    <div style=\"flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,1fr); gap:22px;\">\n\n      <!-- 1 · URGENT (single) -->\n      <div style=\"display:flex; flex-direction:column; min-height:0;\">\n        <div style=\"flex:none; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:#1a160f; margin-bottom:12px;\">1 · Urgent<\u002Fdiv>\n        <div style=\"flex:1; min-height:0; background:#FFFCF4; border:1px solid rgba(30,20,0,.08); border-radius:20px; overflow:hidden;\">\n          <div style=\"height:100%; box-sizing:border-box; padding:30px 28px; display:flex; flex-direction:column;\">\n            <div style=\"flex:none; width:54px; height:54px; border-radius:14px; background:#F4E7C6; border:1px solid rgba(30,20,0,.06); display:flex; align-items:center; justify-content:center; color:#1a160f;\">\n              <i data-lucide=\"{{ urgent.icon }}\" style=\"width:26px;height:26px;\"><\u002Fi>\n            <\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; line-height:1.2; color:#1a160f; margin-top:18px;\">{{ urgent.name }}<\u002Fdiv>\n            <div style=\"font-size:14px; line-height:1.5; color:#7a7161; margin-top:12px; flex:1; min-height:0; overflow:hidden;\">{{ urgent.desc }}<\u002Fdiv>\n            <div style=\"padding-top:16px; border-top:1px solid rgba(30,20,0,.08);\">\n              <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; color:#1a160f;\">{{ urgent.price }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:#9a917f; margin-top:2px;\">{{ urgent.unit }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; height:36px; margin-top:14px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#9a917f;\">One option · fixed scope<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 2 · SUBSCRIPTION (carousel) -->\n      <div style=\"display:flex; flex-direction:column; min-height:0;\">\n        <div style=\"flex:none; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:#1a160f; margin-bottom:12px;\">2 · Subscription<\u002Fdiv>\n        <div style=\"flex:1; min-height:0; position:relative; background:#FFFCF4; border:1px solid rgba(30,20,0,.08); border-radius:20px; overflow:hidden; touch-action:pan-y; cursor:grab;\" sc-camel-on-pointer-down=\"{{ subDown }}\" sc-camel-on-pointer-up=\"{{ onUp }}\">\n          <div style=\"display:flex; height:100%; transition:transform .45s cubic-bezier(.4,0,.2,1); transform: {{ subShift }};\">\n            <sc-for list=\"{{ subSlides }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"flex:0 0 100%; height:100%; box-sizing:border-box; padding:30px 28px; display:flex; flex-direction:column;\">\n                <div style=\"flex:none; width:54px; height:54px; border-radius:14px; background:#F4E7C6; border:1px solid rgba(30,20,0,.06); display:flex; align-items:center; justify-content:center; color:#1a160f;\">\n                  <i data-lucide=\"{{ s.icon }}\" style=\"width:26px;height:26px;\"><\u002Fi>\n                <\u002Fdiv>\n                <div style=\"font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#9a917f; margin-top:18px;\">{{ s.label }}<\u002Fdiv>\n                <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; color:#1a160f; margin-top:2px;\">Plan {{ s.size }}<\u002Fdiv>\n                <div style=\"font-size:14px; line-height:1.5; color:#7a7161; margin-top:12px; flex:1; min-height:0; overflow:hidden;\">{{ s.note }}<\u002Fdiv>\n                <div style=\"padding-top:16px; border-top:1px solid rgba(30,20,0,.08); display:flex; align-items:baseline; gap:8px;\">\n                  <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; color:#c9791f;\">{{ s.price }}<\u002Fspan>\n                  <span style=\"font-size:13px; color:#9a917f;\">{{ s.unit }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; height:36px; margin-top:14px; display:flex; align-items:center; justify-content:center; gap:14px;\">\n          <div sc-camel-on-click=\"{{ prevSub }}\" style=\"width:34px; height:34px; border-radius:999px; background:#1c1a15; color:#FBF1DA; display:flex; align-items:center; justify-content:center; cursor:pointer;\"><i data-lucide=\"chevron-left\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fdiv>\n          <div style=\"display:flex; gap:8px;\">\n            <sc-for list=\"{{ subDots }}\" as=\"d\" hint-placeholder-count=\"3\">\n              <sc-if value=\"{{ d.active }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-on-click=\"{{ d.go }}\" style=\"width:24px; height:8px; border-radius:999px; background:#1a160f; cursor:pointer;\"><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ d.inactive }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-on-click=\"{{ d.go }}\" style=\"width:8px; height:8px; border-radius:999px; background:rgba(30,20,0,.18); cursor:pointer;\"><\u002Fdiv><\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nextSub }}\" style=\"width:34px; height:34px; border-radius:999px; background:#1c1a15; color:#FBF1DA; display:flex; align-items:center; justify-content:center; cursor:pointer;\"><i data-lucide=\"chevron-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 3 · PROJECT WORK (carousel) -->\n      <div style=\"display:flex; flex-direction:column; min-height:0;\">\n        <div style=\"flex:none; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:#1a160f; margin-bottom:12px;\">3 · Project work<\u002Fdiv>\n        <div style=\"flex:1; min-height:0; position:relative; background:#FFFCF4; border:1px solid rgba(30,20,0,.08); border-radius:20px; overflow:hidden; touch-action:pan-y; cursor:grab;\" sc-camel-on-pointer-down=\"{{ projDown }}\" sc-camel-on-pointer-up=\"{{ onUp }}\">\n          <div style=\"display:flex; height:100%; transition:transform .45s cubic-bezier(.4,0,.2,1); transform: {{ projShift }};\">\n            <sc-for list=\"{{ projSlides }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"flex:0 0 100%; height:100%; box-sizing:border-box; padding:30px 28px; display:flex; flex-direction:column;\">\n                <div style=\"flex:none; width:54px; height:54px; border-radius:14px; background:#F4E7C6; border:1px solid rgba(30,20,0,.06); display:flex; align-items:center; justify-content:center; color:#1a160f;\">\n                  <i data-lucide=\"{{ p.icon }}\" style=\"width:26px;height:26px;\"><\u002Fi>\n                <\u002Fdiv>\n                <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; line-height:1.2; color:#1a160f; margin-top:18px;\">{{ p.title }}<\u002Fdiv>\n                <div style=\"display:inline-block; align-self:flex-start; margin-top:10px; background:#F4E7C6; border:1px solid rgba(30,20,0,.10); border-radius:999px; padding:4px 12px; font-size:12px; font-weight:600; color:#8a6a2a;\">{{ p.duration }}<\u002Fdiv>\n                <div style=\"font-size:14px; line-height:1.5; color:#7a7161; margin-top:12px; flex:1; min-height:0; overflow:hidden;\">{{ p.desc }}<\u002Fdiv>\n                <div style=\"padding-top:16px; border-top:1px solid rgba(30,20,0,.08); display:flex; align-items:baseline; gap:8px;\">\n                  <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; color:#1a160f;\">{{ p.price }}<\u002Fspan>\n                  <span style=\"font-size:13px; color:#9a917f;\">{{ p.unit }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; height:36px; margin-top:14px; display:flex; align-items:center; justify-content:center; gap:14px;\">\n          <div sc-camel-on-click=\"{{ prevProj }}\" style=\"width:34px; height:34px; border-radius:999px; background:#1c1a15; color:#FBF1DA; display:flex; align-items:center; justify-content:center; cursor:pointer;\"><i data-lucide=\"chevron-left\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fdiv>\n          <div style=\"display:flex; gap:8px;\">\n            <sc-for list=\"{{ projDots }}\" as=\"d\" hint-placeholder-count=\"3\">\n              <sc-if value=\"{{ d.active }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-on-click=\"{{ d.go }}\" style=\"width:24px; height:8px; border-radius:999px; background:#1a160f; cursor:pointer;\"><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ d.inactive }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-on-click=\"{{ d.go }}\" style=\"width:8px; height:8px; border-radius:999px; background:rgba(30,20,0,.18); cursor:pointer;\"><\u002Fdiv><\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nextProj }}\" style=\"width:34px; height:34px; border-radius:999px; background:#1c1a15; color:#FBF1DA; display:flex; align-items:center; justify-content:center; cursor:pointer;\"><i data-lucide=\"chevron-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- CTA -->\n    <div style=\"flex:none; margin-top:24px; background:#1c1a15; border-radius:20px; padding:24px 36px; display:flex; align-items:center; justify-content:space-between; gap:32px;\">\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; color:#FBF1DA;\">Not sure which one fits?<\u002Fdiv>\n        <div style=\"font-size:14px; color:#b8b0a0; margin-top:4px;\">Tell me what you're working on and I'll point you to the right engagement.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:none; background:#FBF1DA; color:#1a160f; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; padding:13px 26px; border-radius:12px;\">Message me →<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { subIdx: 0, projIdx: 0 };\n\n  step(key, dir, len) {\n    this.setState(s => {\n      let v = s[key] + dir;\n      v = Math.max(0, Math.min(len - 1, v));\n      return { [key]: v };\n    });\n  }\n  down(e, key) { this._d = { x: e.clientX, key, len: 3 }; }\n  up(e) {\n    if (!this._d) return;\n    const dx = e.clientX - this._d.x;\n    if (dx > 40) this.step(this._d.key, -1, this._d.len);\n    else if (dx < -40) this.step(this._d.key, 1, this._d.len);\n    this._d = null;\n  }\n\n  renderVals() {\n    const tiers = [\n      {size:'S', price:'$1,000', unit:'/ mo', note:'Light monthly upkeep — small changes and priority answers.'},\n      {size:'M', price:'$2,000', unit:'/ mo', note:'Regular changes plus ongoing support for a live dashboard set.'},\n      {size:'L', price:'$2,500', unit:'/ mo', note:'Priority support and higher volume of changes each month.'},\n    ];\n    const urgent = {icon:'zap', name:'Urgent BI solution request', desc:'Same-week fix for a broken report, blocked refresh, or a deadline dashboard.', price:'$1k–3k', unit:'one-off'};\n    const subSlides = tiers.map(t => ({...t, icon:'refresh-cw', label:'Regular support / subscription'}));\n    const projSlides = [\n      {icon:'flag', title:'Project work — short term', duration:'~3 months', desc:'A single dashboard or focused report, scoped and shipped end to end.', price:'$2k–5k', unit:'project'},\n      {icon:'map',  title:'Project work — mid term',  duration:'6–12 months', desc:'A clean data model plus a connected set of dashboards for a team.', price:'$5k–12k', unit:'project'},\n      {icon:'route',title:'Project work — long term', duration:'12+ months', desc:'A full reporting platform built and evolved from source data to delivery.', price:'$10k–25k', unit:'project'},\n    ];\n    const si = this.state.subIdx, pi = this.state.projIdx;\n    const dots = (arr, idx, key) => arr.map((_, i) => ({ active: i === idx, inactive: i !== idx, go: () => this.setState({ [key]: i }) }));\n\n    return {\n      urgent,\n      subSlides,\n      projSlides,\n      subShift: `translateX(-${si * 100}%)`,\n      projShift: `translateX(-${pi * 100}%)`,\n      subDots: dots(subSlides, si, 'subIdx'),\n      projDots: dots(projSlides, pi, 'projIdx'),\n      prevSub: () => this.step('subIdx', -1, subSlides.length),\n      nextSub: () => this.step('subIdx', 1, subSlides.length),\n      prevProj: () => this.step('projIdx', -1, projSlides.length),\n      nextProj: () => this.step('projIdx', 1, projSlides.length),\n      subDown: (e) => this.down(e, 'subIdx'),\n      projDown: (e) => this.down(e, 'projIdx'),\n      onUp: (e) => this.up(e),\n    };\n  }\n  componentDidMount() { this.paintIcons(); }\n  componentDidUpdate() { this.paintIcons(); }\n  paintIcons() {\n    if (window.lucide && window.lucide.createIcons) {\n      clearTimeout(this._t);\n      this._t = setTimeout(() => window.lucide.createIcons(), 30);\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
  </body>
